<html lang="en">
<head>

<style>
/* ── RESET ───────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── DESIGN SYSTEM: --u = one design pixel of the 1353 × 1163 reference ── */
:root{
  --dw:1353; --dh:1163; --gutter:25;
  --u:max(min(.72px, calc(100vh / 700)), min(calc(100vw / 1353), calc(100vh / 1163)));
  --dh-px:calc(1163 * var(--u));
  --vshift:calc(max(0px, (100vh - var(--dh-px))) * .42);
  --ink:#ffffff; --cyan:#79dce8; --cyan-logo:#5fd0e1;
  --rule:rgba(255,255,255,.23); --btn-ink:#071227;
  --font-serif:'Prata', Georgia, serif;
  --font-body:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-logo:'Poppins', sans-serif;
  --e-expo:cubic-bezier(.16,1,.3,1); --e-quint:cubic-bezier(.22,1,.36,1);
  --e-slow:cubic-bezier(.4,0,.2,1); --e-in:cubic-bezier(.55,0,.75,.2);
}
@supports (height:100dvh){
  :root{
    --u:max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
    --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .42);
  }
}
html,body{height:100%}
body{background:#04101f; color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision; overflow:hidden}

/* ── STAGE ───────────────────────────────────────────────────────────── */
/* clip, not just hide: a hidden box is still scrollable, so focusing the edge-cropped
   right planet would scroll the whole stage sideways */
.stage{position:fixed; inset:0; overflow:hidden; overflow:clip; isolation:isolate}
.sky{position:absolute; inset:0; z-index:0;
  background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png");
  background-size:cover; background-position:center; background-repeat:no-repeat}
.ui{position:absolute; inset:0; z-index:3}

/* ── BACKDROP ────────────────────────────────────────────────────────── */
.sky video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  display:block; opacity:0; transition:opacity .22s linear}
.sky video.is-active{opacity:1}
@media (prefers-reduced-motion:reduce){ .sky video{display:none} }

/* ── SIDE PLANET SLOTS ───────────────────────────────────────────────── */
.planet{position:absolute; z-index:-1; padding:0; border:0; background:none;
  -webkit-appearance:none; appearance:none; line-height:0; cursor:pointer;
  pointer-events:auto; -webkit-tap-highlight-color:transparent;
  transition:transform .45s cubic-bezier(.22,1,.36,1)}
.planet img{display:none; width:100%; height:auto}
.planet img.is-shown{display:block}
.planet:hover{transform:scale(1.045)}
.planet:active{transform:scale(.99)}
.planet-l{width:calc(143 * var(--u)); left:calc(-69.5 * var(--u)); top:calc(-38.3 * var(--u))}
.planet-r{width:calc(143 * var(--u)); right:calc(-64.7 * var(--u)); top:calc(-40.6 * var(--u))}
@media (prefers-reduced-motion:reduce){
  .planet{transition:none} .planet:hover,.planet:active{transform:none} }

/* ── LAYOUT ──────────────────────────────────────────────────────────── */
.copy{position:absolute; inset:0; transform:translateY(var(--vshift)); pointer-events:none}
.copy a{pointer-events:auto}
.col{position:absolute; left:0; right:calc(var(--gutter) * var(--u)); text-align:center}

/* ── NAV ─────────────────────────────────────────────────────────────── */
.navbar{position:absolute; top:0; left:0; right:0; z-index:6; height:calc(88 * var(--u))}
.navbar::after{content:""; position:absolute; left:calc(25 * var(--u));
  right:calc(49 * var(--u)); top:calc(86 * var(--u)); height:calc(2 * var(--u));
  background:var(--rule)}
.navrow{position:absolute; left:calc(25 * var(--u)); right:calc(49 * var(--u)); top:0;
  height:calc(86 * var(--u)); display:flex; align-items:center; justify-content:space-between}
.logo{display:block; line-height:0; text-decoration:none; position:relative;
  top:calc(-1 * var(--u)); -webkit-tap-highlight-color:transparent}
.logo img{display:block; width:auto; height:calc(32 * var(--u))}

/* ── HERO COPY ───────────────────────────────────────────────────────── */
.eyebrow{top:calc(188.8 * var(--u)); font-size:calc(30.45 * var(--u)); font-weight:500;
  line-height:1; letter-spacing:calc(4 * var(--u)); text-indent:calc(4 * var(--u)); color:#fff}
h1.title{top:calc(268 * var(--u)); font-family:var(--font-serif); font-weight:400;
  font-size:calc(112.4 * var(--u)); line-height:1; letter-spacing:calc(2 * var(--u));
  text-indent:calc(2 * var(--u)); color:#fff}
.rule{top:calc(405.5 * var(--u)); height:calc(5 * var(--u)); font-size:0; line-height:0;
  padding-right:calc(2 * var(--u))}
.rule span{display:inline-block; vertical-align:top; width:calc(100 * var(--u));
  height:100%; border-radius:calc(2.5 * var(--u)); background:var(--cyan)}
p.lede{top:calc(433.2 * var(--u)); font-size:calc(18.36 * var(--u)); font-weight:400;
  line-height:calc(30 * var(--u)); color:rgba(255,255,255,.95)}

/* ── CTA ROW ─────────────────────────────────────────────────────────── */
.cta{top:calc(597 * var(--u)); height:calc(66 * var(--u)); isolation:isolate}
.cta a{display:inline-flex; align-items:center; justify-content:center;
  width:calc(216 * var(--u)); height:calc(66 * var(--u)); border-radius:calc(33 * var(--u));
  font-size:calc(17 * var(--u)); font-weight:700; letter-spacing:0; text-indent:0;
  line-height:1; color:var(--btn-ink); text-decoration:none; padding-top:calc(2 * var(--u));
  background:linear-gradient(180deg,#ffffff 0%,#d6e8f8 4%,#d9ecfe 72%,#ffffff 100%);
  box-shadow:0 calc(10 * var(--u)) calc(18 * var(--u)) calc(-8 * var(--u)) rgba(255,255,255,.50),
             0 0 calc(26 * var(--u)) rgba(255,255,255,.18),
             inset 0 0 0 calc(2 * var(--u)) rgba(255,255,255,.9)}
.label{position:absolute; top:calc(33 * var(--u)); font-family:var(--font-serif);
  font-weight:400; font-size:calc(17.8 * var(--u)); letter-spacing:calc(4.6 * var(--u));
  line-height:1; color:#fff; white-space:nowrap}
.label.label-l{left:calc(111 * var(--u))}
.label.label-r{right:calc(104 * var(--u))}

/* ── SCROLL CONTROL ──────────────────────────────────────────────────── */
.scroll{position:absolute; z-index:4; left:50%;
  margin-left:calc((-48 - (var(--gutter) / 2)) * var(--u)); bottom:calc(68 * var(--u));
  width:calc(96 * var(--u)); height:calc(96 * var(--u)); border-radius:50%;
  background:rgba(24,30,42,.70); -webkit-backdrop-filter:blur(calc(6 * var(--u)));
  backdrop-filter:blur(calc(6 * var(--u))); border:0; display:flex; align-items:center;
  justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent}
.scroll svg{width:calc(20 * var(--u)); height:calc(25 * var(--u)); display:block}

/* ── FOCUS ───────────────────────────────────────────────────────────── */
.scroll:focus-visible,.cta a:focus-visible,.logo:focus-visible{
  outline:calc(2 * var(--u)) solid var(--cyan); outline-offset:calc(3 * var(--u))}
.planet:focus-visible{outline:calc(2 * var(--u)) solid var(--cyan);
  outline-offset:calc(6 * var(--u)); border-radius:50%}

/* ════════════════════════════════════════════════════════════════════════
   RESPONSIVE — tiers in source order
   ════════════════════════════════════════════════════════════════════════ */

/* TABLET — re-proportioned, not stacked */
@media (min-width:580px) and (max-width:1030px) and (min-height:621px){
  :root{--gutter:0;
    --u:min(max(min(.85px, calc(100vh / 780)), min(calc(100vw / 900), calc(100vh / 1163))), 1.15px);
    --dh-px:calc(1120 * var(--u));
    --vshift:calc(max(0px, (100vh - var(--dh-px))) * .38)}
  @supports (height:100dvh){
    :root{
      --u:min(max(min(.85px, calc(100dvh / 780)), min(calc(100vw / 900), calc(100dvh / 1163))), 1.15px);
      --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .38)}
  }
  .navrow{right:calc(25 * var(--u))}
  .navbar::after{left:calc(25 * var(--u)); right:calc(25 * var(--u))}
  p.lede br{display:none}
  p.lede{max-width:calc(620 * var(--u)); margin-left:auto; margin-right:auto; text-wrap:pretty}
  .label.label-r{right:calc(116 * var(--u))}
}

/* PHONE — below the nav the interface flows */
@media (max-width:579px), (max-height:620px){
  :root{--gutter:0;
    --u:max(min(.92px, calc(100vh / 620)), min(calc(100vw / 430), calc(100vh / 880)));
    --dh-px:calc(880 * var(--u));
    --vshift:calc(max(0px, (100vh - var(--dh-px))) * .34)}
  @supports (height:100dvh){
    :root{
      --u:max(min(.92px, calc(100dvh / 620)), min(calc(100vw / 430), calc(100dvh / 880)));
      --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .34)}
  }
  .navbar{height:calc(76 * var(--u))}
  .navbar::after{left:calc(24 * var(--u)); right:calc(24 * var(--u)); top:calc(74 * var(--u))}
  .navrow{left:calc(24 * var(--u)); right:calc(24 * var(--u)); height:calc(74 * var(--u))}
  .logo img{height:calc(30 * var(--u))}
  .copy{top:calc(76 * var(--u)); display:flex; flex-direction:column; align-items:center;
    padding:calc(56 * var(--u)) calc(26 * var(--u)) 0}
  .col{position:static; width:100%; right:auto}
  .eyebrow{font-size:calc(20 * var(--u)); letter-spacing:calc(5 * var(--u)); text-indent:calc(5 * var(--u))}
  h1.title{font-size:calc(86 * var(--u)); margin-top:calc(15 * var(--u))}
  .rule{margin-top:calc(20 * var(--u)); height:calc(5 * var(--u)); padding-right:0}
  .rule span{width:calc(84 * var(--u))}
  p.lede{margin-top:calc(19 * var(--u)); font-size:calc(15.5 * var(--u));
    line-height:calc(26 * var(--u)); max-width:calc(400 * var(--u)); text-wrap:balance}
  p.lede br{display:none}
  .cta{top:auto; margin-top:calc(32 * var(--u)); height:calc(60 * var(--u)); position:relative}
  .cta a{width:calc(190 * var(--u)); height:calc(60 * var(--u)); border-radius:calc(30 * var(--u))}
  .label{top:50%; transform:translateY(-50%); font-size:calc(16 * var(--u));
    letter-spacing:calc(4 * var(--u))}
  .label.label-l{left:calc(56 * var(--u))}
  .label.label-r{right:calc(60 * var(--u))}
  .planet-l{width:calc(89 * var(--u)); left:calc(-44.5 * var(--u)); top:calc(-17 * var(--u))}
  .planet-r{width:calc(89 * var(--u)); right:calc(-44.5 * var(--u)); top:calc(-18.3 * var(--u))}
  .scroll{width:calc(74 * var(--u)); height:calc(74 * var(--u));
    margin-left:calc(-37 * var(--u)); bottom:calc(49 * var(--u))}
  .scroll svg{width:calc(15.5 * var(--u)); height:calc(19.5 * var(--u))}
}

/* no room for the scroll control */
@media (max-height:660px){ .scroll{display:none} }

/* SHORT */
@media (max-height:620px){
  :root{--u:max(min(.85px, calc(100vh / 470)), min(calc(100vw / 640), calc(100vh / 560)));
    --dh-px:calc(560 * var(--u)); --vshift:0px}
  @supports (height:100dvh){
    :root{--u:max(min(.85px, calc(100dvh / 470)), min(calc(100vw / 640), calc(100dvh / 560)))}
  }
  .copy{padding-top:calc(26 * var(--u))}
  h1.title{font-size:calc(64 * var(--u)); margin-top:calc(8 * var(--u))}
  .rule{margin-top:calc(12 * var(--u))}
  p.lede{margin-top:calc(12 * var(--u))}
  .cta{margin-top:calc(20 * var(--u))}
  .label{top:50%; transform:translateY(-50%); font-size:calc(15 * var(--u))}
  .label.label-l{left:calc(58 * var(--u))}
  .label.label-r{right:calc(58 * var(--u))}
}
@media (min-width:821px) and (max-height:660px){ .copy{transform:none} }

/* NARROW PHONE — declared last so it wins inside the short tier */
@media (max-width:500px){
  .label{top:calc(100% + 34 * var(--u)); transform:none; font-size:calc(15 * var(--u))}
  .label.label-l{left:calc(6 * var(--u))}
  .label.label-r{right:calc(6 * var(--u))}
}

/* ════════════════════════════════════════════════════════════════════════
   ENTRANCE — runs once; .anim/.play are removed afterwards
   DRAW · REVEAL · RISE · SETTLE · FADE
   ════════════════════════════════════════════════════════════════════════ */
@keyframes ent-reveal{from{transform:translateY(115%)}to{transform:translateY(0)}}
@keyframes ent-rise{from{opacity:0;transform:translateY(var(--rise,10px))}to{opacity:1;transform:none}}
@keyframes ent-settle{from{opacity:0;transform:translateY(var(--rise,8px)) scale(.965)}to{opacity:1;transform:none}}
@keyframes ent-draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ent-fade{from{opacity:0}to{opacity:1}}

.ent-mask,.ent-line{display:block}
.anim .ent-mask{overflow:hidden; padding-top:.18em; margin-top:-.18em}
.anim .ent-line{transform:translateY(115%); will-change:transform}
.anim .navbar::after,.anim .rule span{transform:scaleX(0)}
.anim .logo,.anim p.lede,.anim .label,.anim .cta a,.anim .scroll,.anim .sky{opacity:0}
.anim .sky{will-change:opacity}

.anim.play .sky{animation:ent-fade 1.6s var(--e-slow) .25s both}
.anim.play .navbar::after{animation:ent-draw .9s var(--e-expo) .12s both}
.anim.play .logo{--rise:calc(8 * var(--u)); animation:ent-rise .6s var(--e-quint) .2s both}
.anim.play .eyebrow .ent-line{animation:ent-reveal .75s var(--e-expo) .3s both}
.anim.play h1.title .ent-line{animation:ent-reveal .95s var(--e-expo) .44s both}
.anim.play .rule span{animation:ent-draw .65s var(--e-expo) .78s both}
.anim.play p.lede{--rise:calc(12 * var(--u)); animation:ent-rise .7s var(--e-quint) .86s both}
/* labels compose onto their resting transform (the phone tiers centre them with
   translateY(-50%)), so nothing jumps when .anim/.play are removed */
.anim.play .label{animation-composition:add}
.anim.play .label.label-l{--rise:calc(8 * var(--u)); animation:ent-rise .6s var(--e-quint) 1.04s both}
.anim.play .label.label-r{--rise:calc(8 * var(--u)); animation:ent-rise .6s var(--e-quint) 1.1s both}
.anim.play .cta a{--rise:calc(8 * var(--u)); animation:ent-settle .7s var(--e-quint) 1.14s both}
.anim.play .scroll{animation:ent-settle .6s var(--e-quint) 1.42s both}

/* ════════════════════════════════════════════════════════════════════════
   PLANET SWITCH — the clicked planet flies to the centre, turning as it grows,
   and dissolves into its backdrop; the old planet condenses out of the centre
   and orbits back into a side slot. The headline rolls over to the new name.
   (JS adds .warp + .warp-out, then swaps the state and flips to .warp-in.)
   ════════════════════════════════════════════════════════════════════════ */
@keyframes warp-lift{from{transform:translateY(0)}to{transform:translateY(-115%)}}
@keyframes warp-leave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(calc(-8 * var(--u)))}}
@keyframes warp-undraw{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes warp-dim{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(calc(6 * var(--u)))}}
@keyframes warp-glow{from{opacity:0;filter:blur(calc(6 * var(--u)))}to{opacity:1;filter:blur(0)}}

.warp .ent-mask{overflow:hidden; padding-top:.18em; margin-top:-.18em}
.sky.is-warp video{transition:opacity .7s var(--e-slow)}
.ghost{position:absolute; left:0; top:0; z-index:2; display:block; pointer-events:none;
  will-change:transform,opacity}

.warp-out h1.title .ent-line{animation:warp-lift .38s var(--e-in) both}
.warp-out p.lede{animation:warp-leave .3s var(--e-in) both}
.warp-out .rule span{animation:warp-undraw .32s var(--e-in) both}
.warp-out .label.is-leaving{animation:warp-dim .26s linear both}

.warp-in h1.title .ent-line{animation:ent-reveal .9s var(--e-expo) both}
.warp-in .rule span{animation:ent-draw .65s var(--e-expo) .12s both}
.warp-in p.lede{--rise:calc(12 * var(--u)); animation:ent-rise .7s var(--e-quint) .14s both}
.warp-in .label.is-arriving{animation:warp-glow .6s var(--e-quint) .3s both}
</style>
</head>

      poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png"
      aria-hidden="true"></video>
    <video data-planet="venus" muted loop playsinline preload="none"

      poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png"
      aria-hidden="true"></video>
    <video data-planet="mars" muted loop playsinline preload="none"
      data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202422_51eae59a-2459-4c84-907c-cc5edfe5fea7.mp4"
      poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png"
      aria-hidden="true"></video>
  </div>

  <div class="ui">

<script>
(function(){
  'use strict';
  var root = document.documentElement;
  var each = function(list, fn){ Array.prototype.forEach.call(list, fn); };

  /* ── ENTRANCE: fonts ready (500ms guard) → 2 × rAF → .play → clean up ── */
  (function(){
    if(!root.classList.contains('anim')) return;
    var started = false;
    var guard = setTimeout(start, 500);
    function start(){
      if(started) return;
      started = true;
      clearTimeout(guard);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          root.classList.add('play');
          setTimeout(function(){ root.classList.remove('anim', 'play'); }, 2150);
        });
      });
    }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(start, start); }
    else { start(); }
  })();

  /* ── PLANET DATA ─────────────────────────────────────────────────────── */
  var ORDER = ['earth', 'venus', 'mars'];
  var CDN = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
  var PLANETS = {
    earth: {
      name: 'EARTH',
      cutout: CDN + 'hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png',
      still:  CDN + 'hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',
      lede: 'Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    },
    venus: {
      name: 'VENUS',
      cutout: CDN + 'hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png',
      still:  CDN + 'hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',
      lede: 'The hottest world in our solar system, wrapped in clouds of sulfuric acid. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    },
    mars: {
      name: 'MARS',
      cutout: CDN + 'hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png',
      still:  CDN + 'hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',
      lede: 'The rust-red desert world, home to the tallest volcano we know of. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    }
  };

  var stage = document.querySelector('.stage');
  var sky = document.querySelector('.sky');
  var clips = sky.querySelectorAll('video');
  var titleLine = document.querySelector('h1.title .ent-line');
  var lede = document.querySelector('p.lede');
  var slots = [
    { btn: document.querySelector('.planet-l'), label: document.querySelector('.label-l'), side: -1 },
    { btn: document.querySelector('.planet-r'), label: document.querySelector('.label-r'), side:  1 }
  ];
  each(slots, function(s){ s.imgs = s.btn.querySelectorAll('img'); });

  var current = null;

  /* browsers without overflow:clip can still scroll the stage when an edge-cropped
     planet takes focus; pin it */
  stage.addEventListener('scroll', function(){
    if(stage.scrollLeft || stage.scrollTop){ stage.scrollLeft = 0; stage.scrollTop = 0; }
  });

  function clipFor(key){
    for(var i = 0; i < clips.length; i++){ if(clips[i].dataset.planet === key) return clips[i]; }
    return null;
  }
  function shownImg(slot){
    for(var i = 0; i < slot.imgs.length; i++){ if(slot.imgs[i].classList.contains('is-shown')) return slot.imgs[i]; }
    return null;
  }

  /* ── STATE: everything flips in one synchronous call ─────────────────── */
  function show(next){
    var p = PLANETS[next];
    if(!p || next === current) return;
    current = next;

    each(clips, function(v){
      var on = v.dataset.planet === next;
      if(on && !v.getAttribute('src') && v.dataset.src){ v.src = v.dataset.src; }
      v.classList.toggle('is-active', on);
      if(on){
        var pr = v.play();
        if(pr && typeof pr.catch === 'function') pr.catch(function(){});
      } else {
        v.pause();
      }
    });

    sky.style.backgroundImage = 'url("' + p.still + '")';
    titleLine.textContent = p.name;
    lede.innerHTML = p.lede;

    var rest = ORDER.filter(function(k){ return k !== next; });
    each(slots, function(s, i){
      var key = rest[i];
      each(s.imgs, function(img){ img.classList.toggle('is-shown', img.dataset.planet === key); });
      s.btn.dataset.planet = key;
      s.btn.setAttribute('aria-label', 'Show ' + PLANETS[key].name);
      s.label.textContent = PLANETS[key].name;
    });
  }

  /* ── TRANSITION ──────────────────────────────────────────────────────── */
  var FLY  = 'cubic-bezier(.65,0,.25,1)';   // slow lift-off, fast middle, eases into the centre
  var LAND = 'cubic-bezier(.22,1,.36,1)';
  var EXPO = 'cubic-bezier(.16,1,.3,1)';
  var IN   = 'cubic-bezier(.55,0,.75,.2)';
  var SWAP_AT = 380;     // ms after the click when the state flips
  var SETTLE  = 1000;    // ms after the flip when every layer is back at rest
  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var busy = false;

  function ghost(img, r){
    var g = document.createElement('img');
    g.className = 'ghost';
    g.alt = '';
    g.setAttribute('aria-hidden', 'true');
    g.src = img.getAttribute('src');
    g.style.width = r.width + 'px';
    g.style.height = r.height + 'px';
    stage.appendChild(g);
    return g;
  }
  function at(x, y, deg, scale){
    return 'translate(' + x + 'px,' + y + 'px) rotate(' + deg + 'deg) scale(' + scale + ')';
  }

  function switchTo(next, from){
    if(!PLANETS[next] || next === current || busy) return;
    if(!stage.animate || (reduceMQ && reduceMQ.matches)){ show(next); return; }
    busy = true;
    root.classList.remove('anim', 'play');     // a click mid-entrance completes it at once
    warm(next);

    var prev = current;
    var vw = stage.clientWidth, vh = stage.clientHeight;
    var D = Math.min(vw, vh) * 0.78;           // diameter the planets grow to / shrink from
    var before = slots.map(function(s){ return s.btn.dataset.planet; });
    var after = ORDER.filter(function(k){ return k !== next; });
    var anims = [], ghosts = [];

    root.classList.add('warp', 'warp-out');
    sky.classList.add('is-warp');
    slots.forEach(function(s, i){ if(before[i] !== after[i]) s.label.classList.add('is-leaving'); });

    /* 1 — the clicked planet lifts out of its slot and flies to the centre,
           turning as it grows, then dissolves into the incoming backdrop */
    var src = shownImg(from), r = src.getBoundingClientRect();
    var g = ghost(src, r);
    ghosts.push(g);
    anims.push(g.animate([
      { transform: at(r.left, r.top, 0, 1) },
      { transform: at(vw / 2 - r.width / 2, vh / 2 - r.height / 2, -from.side * 45, D / r.width) }
    ], { duration: 1100, easing: FLY, fill: 'forwards' }));
    anims.push(g.animate([{ opacity: 1 }, { opacity: 1, offset: .45 }, { opacity: 0 }],
      { duration: 1100, fill: 'forwards' }));
    anims.push(src.animate([{ opacity: 0 }, { opacity: 0 }], { duration: SWAP_AT + 50, fill: 'forwards' }));

    /* a planet that has to change sides rolls out of its old slot */
    slots.forEach(function(s, i){
      if(s === from || before[i] === after[i]) return;
      anims.push(shownImg(s).animate([
        { opacity: 1, transform: 'none' },
        { opacity: 0, transform: 'scale(.6) rotate(' + (-s.side * 20) + 'deg)' }
      ], { duration: 300, easing: IN, fill: 'forwards' }));
    });

    setTimeout(function(){
      /* 2 — flip the whole state in one frame */
      show(next);
      root.classList.remove('warp-out');
      root.classList.add('warp-in');
      slots.forEach(function(s, i){
        s.label.classList.remove('is-leaving');
        if(before[i] !== after[i]) s.label.classList.add('is-arriving');
      });

      /* backdrop: the incoming clip settles out of a slight zoom while the old one drifts on */
      each(clips, function(v){
        if(v.dataset.planet === next){
          anims.push(v.animate([{ transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 1600, easing: EXPO }));
        } else if(v.dataset.planet === prev){
          anims.push(v.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }], { duration: 700 }));
        }
      });

      /* 3 — refill the slots */
      slots.forEach(function(s, i){
        if(before[i] === after[i]) return;
        var img = shownImg(s);
        if(after[i] === prev){
          /* the old featured planet condenses out of the centre and orbits into this slot */
          var t = img.getBoundingClientRect();
          var go = ghost(img, t);
          ghosts.push(go);
          anims.push(go.animate([
            { transform: at(vw / 2 - t.width / 2, vh / 2 - t.height / 2, -s.side * 40, D / t.width) },
            { transform: at(t.left, t.top, 0, 1) }
          ], { duration: 900, easing: LAND, fill: 'forwards' }));
          anims.push(go.animate([{ opacity: 0 }, { opacity: 0, offset: .12 }, { opacity: 1, offset: .5 }, { opacity: 1 }],
            { duration: 900, fill: 'forwards' }));
          anims.push(img.animate([{ opacity: 0 }, { opacity: 0 }], { duration: 900 }));
        } else {
          /* a planet changing sides rolls into its new slot */
          anims.push(img.animate([
            { opacity: 0, transform: 'scale(.55) rotate(' + (-s.side * 25) + 'deg)' },
            { opacity: 1, transform: 'none' }
          ], { duration: 750, delay: 220, easing: LAND, fill: 'backwards' }));
        }
      });

      setTimeout(function(){
        anims.forEach(function(a){ a.cancel(); });
        ghosts.forEach(function(x){ x.remove(); });
        root.classList.remove('warp', 'warp-in');
        sky.classList.remove('is-warp');
        slots.forEach(function(s){ s.label.classList.remove('is-arriving'); });
        busy = false;
      }, SETTLE);
    }, SWAP_AT);
  }

  /* ── CLIP PREFETCH ───────────────────────────────────────────────────── */
  function warm(key){
    var v = clipFor(key);
    if(v && !v.getAttribute('src') && v.dataset.src){
      v.preload = 'auto';
      v.src = v.dataset.src;
      v.load();
    }
  }

  each(slots, function(s){
    var intent = function(){ warm(s.btn.dataset.planet); };
    s.btn.addEventListener('pointerenter', intent);
    s.btn.addEventListener('focus', intent);
    s.btn.addEventListener('click', function(){ switchTo(this.dataset.planet, s); });
  });

  /* after first paint, pull the remaining clips down while the page is idle */
  function warmAll(){ ORDER.forEach(warm); }
  function scheduleWarm(){
    requestAnimationFrame(function(){
      setTimeout(function(){
        if('requestIdleCallback' in window){ requestIdleCallback(warmAll, { timeout: 4000 }); }
        else { setTimeout(warmAll, 2500); }
      }, 0);
    });
  }
  if(document.readyState === 'complete'){ scheduleWarm(); }
  else { window.addEventListener('load', scheduleWarm, { once: true }); }

  show('earth');
})();
</script>
</body>
</html>
